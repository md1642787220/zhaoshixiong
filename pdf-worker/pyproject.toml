[project]
name = "shixiong-pdf-worker"
version = "0.1.0"
description = "shixiong PDF 处理 worker（基于 pypdf / PyMuPDF / pdf2docx / pdfplumber / pymupdf4llm / pyHanko）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "PyMuPDF>=1.24",
    "pdf2docx>=0.5.1",
    "pdfplumber>=0.11",
    "pymupdf4llm>=0.0.14",
    "python-docx>=1.1.2",
    "markdown>=3.6",
    "beautifulsoup4>=4.12",
    "pyHanko>=0.36",
]

[tool.uv]
# 优先使用国内镜像源（清华大学 TUNA）
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
