# ============================================================
# shixiong 部署编排
#   - backend      : Node 后端 + 前端静态托管（对外 3000）
#   - pdf-worker   : Python PDF 处理服务（FastAPI + PyMuPDF 等 6 个开源库，对内 8000）
# ============================================================
services:
  backend:
    build: .
    image: shixiong-backend:latest
    container_name: shixiong-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # 指向 Python PDF Worker 服务（docker 内网）
      PDF_WORKER_URL: "http://pdf-worker:8000"
      PDF_WORKER_TIMEOUT: "120000"

  pdf-worker:
    build: ./pdf-worker
    image: shixiong-pdf-worker:latest
    container_name: shixiong-pdf-worker
    restart: unless-stopped
    environment:
      PDF_WORKER_PORT: "8000"
    # 提高内存上限以支持 LibreOffice / 大文件处理
    mem_limit: 2g
